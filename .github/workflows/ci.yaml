permissions:
  contents: read

on:
  workflow_dispatch:
name: ci
jobs:
  units:
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
        - java: 11
          os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest-11-arm64
    steps:
    - name: git configuration to avoid automatic CRLF conversion
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3
      with:
        java-version: ${{ matrix.java }}
        distribution: zulu
        architecture: ${{ matrix.setup_arch || matrix.arch }}
    - run: java -version
    - name: Install google-play-services artifact
      if: runner.os == 'Windows'
      run: |
        mkdir -p play-services
        cd play-services
        curl --fail --location --output play-services-basement-8.3.0.aar https://dl.google.com/dl/android/maven2/com/google/android/gms/play-services-basement/8.3.0/play-services-basement-8.3.0.aar
        unzip -o play-services-basement-8.3.0.aar
        mvn install:install-file -B -ntp \
            -Dfile=classes.jar \
            -DgroupId=com.google.android.google-play-services \
            -DartifactId=google-play-services \
            -Dversion=1 \
            -Dpackaging=jar
    - run: .kokoro/install_dependencies.sh
    - run: .kokoro/build.sh
      env:
        JOB_TYPE: test
    # The `envVarTest` profile runs tests that require an environment variable
    - name: Env Var Tests
      run: |
        mvn test -B -ntp -Dclirr.skip=true -Denforcer.skip=true -PenvVarTest
      # Set the Env Var for this step only
      env:
        GOOGLE_CLOUD_UNIVERSE_DOMAIN: random.com
    name: units [${{ matrix.expander_leg }}]
    timeout-minutes: 150
